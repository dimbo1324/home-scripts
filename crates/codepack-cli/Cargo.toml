[package]
name = "codepack-cli"
description = "Headless command-line interface for codepack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "codepack"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
thiserror.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
codepack-core.workspace = true
codepack-engine.workspace = true
codepack-sanitize.workspace = true
codepack-security.workspace = true
codepack-storage.workspace = true
codepack-tokens.workspace = true
# `verify` reuses S8's traversal-safe extraction rather than opening archives itself.
codepack-archive.workspace = true
# `handoff` writes the file a local agent reads. `default-features = false` on purpose:
# that path needs no HTTP client and no credential store, and this binary must not link
# a transport it can never reach (invariant I1, checked by `cargo xtask gate`).
codepack-ai.workspace = true
# `scan --staged` reads staged blob content out of the index. Same read-only, no-network
# feature set the rest of the workspace already pins.
git2.workspace = true
# Both `verify` and `scan --staged` materialise content into a temporary directory that
# must disappear on every exit path; this is production use, not test-only.
tempfile.workspace = true
walkdir.workspace = true

[dev-dependencies]
# End-to-end tests open the produced bundle to prove a secret never entered it.
zip.workspace = true
# The history test asks the database directly whether a read-only command wrote to it;
# the `runs` list it returns could not have shown that.
rusqlite.workspace = true

[lints]
workspace = true
