[package]
name = "codepack-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Stage S13's offline half: a prompt file and a command for a coding agent already on the machine."

[lints]
workspace = true

# No features. The `api` feature that used to live here is now the separate,
# workspace-excluded `codepack-ai-api` crate: a feature can be switched off by a
# dependent but not by `cargo test --workspace`, which compiles a member with its own
# defaults on every platform (owner decision 2026-09-06, Q41).

[dependencies]
codepack-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
