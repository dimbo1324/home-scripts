name: CI

on:
  push:
    # Every branch, not just main. Until 2026-07-25 a topic branch got no CI at all,
    # so work was only ever verified after it had already been merged. The
    # concurrency group below keys on the ref, so pushing repeatedly to one branch
    # cancels its own superseded runs instead of queueing them.
    branches: ["**"]
  pull_request:

concurrency:
  # `head_ref` is set only for pull_request, `ref` only otherwise, so a branch and its
  # open PR share one group. Without this, enabling push on every branch would run the
  # whole matrix twice for every push to a branch that has a PR open.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # All three again, as of the owner decision 2026-09-06: the product is used by a
        # team on different machines, which reverses the 2026-07-26 narrowing to Windows.
        # Q21 — the Unix `gate` failure that was never root-caused — is what this matrix
        # exists to answer: `fail-fast: false` above means a failure on one OS still
        # reports the other two, so the first green Windows leg does not hide anything.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `codepack-desktop` is a normal cargo workspace member (BLUEPRINT §C.2), so
      # `cargo clippy --workspace`/`cargo test --workspace` build it on every OS, not just
      # when packaging. Tauri's Linux backend links against these system libraries via
      # pkg-config; without them the workspace fails to compile before `cargo xtask gate`
      # even reaches the deny check. Windows (WebView2) and macOS (Xcode Command Line
      # Tools, preinstalled on the runner image) need nothing extra.
      #
      # `libdbus-1-dev` is kept although the crate that most obviously wanted it —
      # `keyring`, via Secret Service — left the workspace with Q41. GTK pulls D-Bus in
      # regardless, and dropping a package from this list on the strength of an untested
      # guess is how a green build becomes a red one on somebody else's machine.
      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      # `cargo xtask gate` runs the frontend format/typecheck/lint checks only when the
      # pnpm toolchain is present, and skips with a notice otherwise. Without these three
      # steps that skip is what CI did — the checks existed and never ran anywhere except a
      # developer's machine. `xtask` now also hard-fails instead of skipping when `CI` is
      # set, so deleting these steps breaks the build loudly rather than silently.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The gate's `dev scripts` step runs the scripts/ test suite, which guards
      # clean-project's protected-path logic. It fails rather than skips when CI is set,
      # so the interpreter is pinned here instead of relying on whatever the runner image
      # happens to ship -- the same reasoning as the pnpm steps above.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cargo xtask gate
        run: cargo xtask gate

      # Stage S10's own acceptance criterion, minus its three-OS half: that part is
      # deferred with cross-platform support (owner decision 2026-07-26), so this now
      # proves headless export on Windows only. The test suite exercises the binary too,
      # but this runs it the way a user's pipeline would -- a release build, on a real
      # checkout, driving the whole eight-step pipeline end to end.
      - name: Headless export (S10 acceptance)
        shell: bash
        run: |
          set -uo pipefail
          cargo build --release -p codepack-cli || exit 1
          mkdir -p "$RUNNER_TEMP/bundle"

          # `|| exported=$?` rather than a bare call followed by `$?`: the shell
          # GitHub runs this with has `errexit` on, so an unguarded non-zero exit would
          # abort the step before the code below ever got to look at it -- which is
          # exactly what happens on 3, the case this step exists to tolerate.
          exported=0
          ./target/release/codepack export . --out "$RUNNER_TEMP/bundle" --safe-mode safe --json > "$RUNNER_TEMP/export.json" || exported=$?

          # 0 and 3 both mean the export itself worked; 3 additionally reports that the
          # bundle contains critical findings. This repository trips that on purpose --
          # codepack-security's own fixtures are credential-shaped, which is the point
          # of them -- so treating 3 as failure here would make the acceptance step fail
          # for a reason that has nothing to do with whether headless export works.
          if [ "$exported" -ne 0 ] && [ "$exported" -ne 3 ]; then
            echo "headless export failed with exit $exported" >&2
            cat "$RUNNER_TEMP/export.json" >&2 || true
            exit 1
          fi

          python3 tests/ci/check_export_report.py "$RUNNER_TEMP/export.json"

      # The scanner's exit code is what a pipeline gates on, so verify the contract
      # rather than assume it.
      - name: Exit code contract (S10 acceptance)
        shell: bash
        run: |
          set -uo pipefail
          fixture="$RUNNER_TEMP/secret-fixture"
          mkdir -p "$fixture"
          printf 'print(1)\n' > "$fixture/main.py"
          printf 'API_KEY=%s\n' 'totally-fake-value-0001' > "$fixture/.env"

          found=0
          ./target/release/codepack scan "$fixture" > /dev/null 2>&1 || found=$?
          if [ "$found" -ne 3 ]; then
            echo "expected exit 3 for a project carrying a credential, got $found" >&2
            exit 1
          fi

          missing=0
          ./target/release/codepack scan "$RUNNER_TEMP/definitely-absent" > /dev/null 2>&1 || missing=$?
          if [ "$missing" -ne 1 ]; then
            echo "expected exit 1 for a missing project, got $missing" >&2
            exit 1
          fi
          echo "exit code contract ok: 3 for findings, 1 for failure"
