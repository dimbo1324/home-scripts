[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
# Stage S13's API path. In the repository, not in the product build: `members` is a glob,
# so the exclusion has to be explicit. A workspace member is compiled with its own default
# features by `cargo test --workspace` on every platform — which is how `keyring` (Secret
# Service on Linux) came to obstruct builds for code no binary could reach. Owner decision
# 2026-09-06, Q41. Built and linted by `cargo xtask ai-api`.
exclude = ["crates/codepack-ai-api"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/dimbo1324/codepack"
publish = false

# Shared dependency versions. Crates opt in with `dep.workspace = true`.
# Every dependency here must be justified by the stage that needs it (see the
# `**Status.**` line under that stage in docs/__arch__/ROADMAP.md for the justification).
[workspace.dependencies]
# S1 (codepack-core): Config and domain types need JSON round-trip and, later,
# consumption by codepack-reports/-storage/the UI without re-deriving.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# S1: mandated by .ai/project/12-domain-rules.md for library error types.
thiserror = "2.0"
# S1: progress/log channel abstraction, reused unchanged by the S9 engine.
crossbeam-channel = "0.5"
# S1 (dev-dependency only): hermetic config load/save tests that never touch the
# developer's real OS config directory.
tempfile = "3.27"
# S2 (codepack-scanner): the first internal path dependency between crates/*.
codepack-core = { path = "crates/codepack-core" }
# S2: directory traversal with symlink-detection support (invariant I7).
walkdir = "2.5"
# S2: parallelizes the per-file classification pass after the walk collects
# candidates (ROADMAP §2 calls this out explicitly for S2).
rayon = "1.10"
# S2: backs a hand-rolled fnmatch.translate-equivalent matcher for .exportignore
# (ignore/globset rejected — see crates/codepack-scanner/src/ignore/pattern.rs).
regex = "1.11"
# S3 (codepack-security): literal-set prefilter before the regex/entropy pass, named
# explicitly in BLUEPRINT §E.6 for this crate. Small, maintained (same author as regex).
aho-corasick = "1.1"
# S4 (codepack-diff): git_ref/uncommitted diff modes need read-only, local-only Git
# access. `default-features = false` plus `vendored-libgit2` deliberately excludes the
# `https`/`ssh`/`cred` features — those exist only for remote git operations
# (fetch/clone/push), which this crate must never perform (invariant I1).
# `vendored-libgit2` statically compiles libgit2 via the `cc` crate at build time, so
# no system libgit2/pkg-config/cmake is required on any of the three CI OSes.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# S4: streamed SHA-256 over raw file bytes for `snapshot_project` (BLUEPRINT §A.6).
# Deliberately not git2's internal object-hashing, which hashes git-blob-formatted
# content (with a header prefix) rather than raw bytes, and would silently diverge from
# legacy's `hashlib.sha256()` computed over the same file's raw bytes.
sha2 = "0.10"
# S5 (codepack-storage): history/snapshots/findings persistence needs transactions,
# indexes, and WAL-mode concurrent access (BLUEPRINT §D). `bundled` statically compiles
# SQLite via the `cc` crate at build time, mirroring S4's `git2`/`vendored-libgit2`
# precedent — no system libsqlite3/pkg-config required on any of the three CI OSes.
rusqlite = { version = "0.32", features = ["bundled"] }
# S7 (codepack-reports): the report runner consumes S2/S3/S4/S6's already-computed
# types directly (`ExportPlan`/`PlannedFile`, `ScanResult`, `DiffSelection`,
# `format_bytes`/token estimates) rather than re-deriving them — registered here
# following the same one-path-dependency-per-line convention as `codepack-core` above.
codepack-scanner = { path = "crates/codepack-scanner" }
codepack-security = { path = "crates/codepack-security" }
codepack-diff = { path = "crates/codepack-diff" }
codepack-tokens = { path = "crates/codepack-tokens" }
# S8 (codepack-archive): building the final ZIP/split-set output (BLUEPRINT §A.8).
# `default-features = false` plus `deflate-flate2-zlib-rs` keeps ZIP_DEFLATED support
# at a specific compression level without pulling in encryption (`aes-crypto`), other
# compression codecs (`bzip2`, `zstd`, `lzma`), or the `zopfli` high-ratio encoder the
# broader `deflate` feature bucket also enables — this crate always writes at a fixed
# level 6 via flate2/zlib-rs, never zopfli's own (different) compression path.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The sterile copy's `.7z` output (owner request 2026-07-29). 7z is a different
# container from ZIP and `zip` cannot write it, so this is a genuinely new capability
# rather than a duplicate of an existing dependency. Pure Rust — no 7-Zip binary on
# `PATH`, no C toolchain — which matters because the product must run on a machine that
# has nothing installed but the app itself. `default-features = false` plus `compress`
# keeps the LZMA2 encoder while leaving out AES encryption, bzip2, PPMd and the `util`
# convenience layer: this crate writes one archive, at one setting, with no password.
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress"] }
# S9 (codepack-engine): the orchestrator's analytics step (6) assembles and runs the
# full report catalog and writes PROJECT_PROFILE.json/REPORT_PLUGINS.json over the
# already-shipped, reviewed codepack-reports crate, rather than re-deriving any of it.
codepack-reports = { path = "crates/codepack-reports" }
# S9 (codepack-engine): the text-dump step's 6-encoding fallback chain
# (utf-8/utf-8-sig/cp1251/cp866/utf-16/latin-1) needs total (never-failing) codecs for
# cp1251/cp866/utf-16 — MIT/Apache-2.0, no copyleft, maintained by the WHATWG/Mozilla
# encoding working group.
encoding_rs = "0.8"
# S9 (codepack-engine): step 8's final archiving reuses the already-shipped, reviewed
# codepack-archive crate (BLUEPRINT §A.8) rather than re-deriving ZIP/split logic in
# the orchestrator itself.
codepack-archive = { path = "crates/codepack-archive" }
# S9 (codepack-engine): persists each export run's history/snapshot/findings via the
# already-shipped, reviewed codepack-storage crate (BLUEPRINT §D) — the orchestrator is
# this crate's first real caller.
codepack-storage = { path = "crates/codepack-storage" }
# S10 (codepack-cli): argument parsing for the headless binary, named in ROADMAP §3.
# `derive` only — no `color`/`suggestions`/`wrap_help`, which pull in terminal and
# fuzzy-matching machinery a CI-facing tool does not need and which would make output
# depend on whether stdout is a TTY.
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
clap_complete = "4.5"
# S10: `.codepack.toml`, the versioned per-project configuration (BLUEPRINT §B.7,
# decision Q6). TOML rather than JSON because this file is written by hand, by humans,
# and lives in the user's repository next to their other tool configuration.
toml = "0.9"
# S10 (codepack-cli): the orchestrator this binary is a front end for.
codepack-engine = { path = "crates/codepack-engine" }
# S11 (apps/desktop/src-tauri): the desktop shell. Tauri rather than Electron because it
# uses the OS webview instead of bundling Chromium (BLUEPRINT §C.1), which is the whole
# reason the rewrite targets it. `tray-icon` is the only non-default feature enabled —
# ROADMAP §3 lists a system tray among S11's acceptance criteria.
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
# S11: the native folder picker and "reveal in file manager"/"open with default app"
# actions. Both are plugins rather than hand-rolled platform code, and both are what
# keeps the webview itself from ever needing filesystem permissions — the UI asks the
# OS through these, never `fs`.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 2026-07-26: one running process per machine. Without this, launching the shortcut again
# starts a second instance, and because each instance builds its own tray icon, the
# notification area fills up with duplicates of the same application. Hand-rolling this
# means a named mutex plus an IPC channel to hand the activation to the first process —
# platform code that this plugin, maintained alongside Tauri itself, already owns.
tauri-plugin-single-instance = "2"
# S11: watch mode (BLUEPRINT §A.10). Cross-platform filesystem notifications with no
# network capability; the same crate `cargo watch` and `rust-analyzer` use.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# S13 (codepack-ai): the only crate in this workspace allowed to reach the network,
# and only on an explicit user action (invariant I1). `cargo xtask gate` fails if any
# other crate declares an HTTP client.
#
# The offline handoff, and nothing else — the API path moved to the excluded
# `codepack-ai-api` crate (Q41), so there is no longer a feature to switch off here.
codepack-ai = { path = "crates/codepack-ai" }
# 2026-07-28 (codepack-sanitize, "Sterile copy" — docs/__arch__/open-questions.md):
# real-grammar comment stripping, chosen explicitly over regex by the owner. `tree-sitter`
# itself and every Batch 1 grammar below are maintained under the `tree-sitter`/
# `tree-sitter-grammars` GitHub orgs and published MIT — verified against crates.io at
# the time this dependency was added, not assumed from memory (`.ai/project/12-domain-
# rules.md`/`deny.toml` both gate on license).
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-bash = "0.25"
# `tree-sitter-grammars` (community org tree-sitter itself points integrators at for
# grammars it does not maintain directly), MIT, same as every grammar above.
tree-sitter-make = "1.1"
# 2026-07-28 (Q24 follow-up): Batch 2's Kotlin closed after a real version/license check,
# not an assumption. The crate literally named `tree-sitter-kotlin` (fwcd/tree-sitter-
# kotlin, last published 2024-08-03) pins `tree-sitter >= 0.21, < 0.23` directly against
# its own `Language` return type and cannot be raised to this workspace's `tree-sitter`
# 0.26 without a second, incompatible copy of the core crate — a real incompatibility,
# not a maintenance judgment call. `tree-sitter-kotlin-ng` is the `tree-sitter-grammars`
# org's fork (github.com/tree-sitter-grammars/tree-sitter-kotlin), MIT, and — like every
# Batch 1 grammar above — depends on the version-independent `tree-sitter-language`
# crate rather than `tree-sitter` itself, so it builds against 0.26 unmodified. Last
# published 2025-01-09, comparable to `tree-sitter-ruby` (2024-11-11) already pinned
# above; not abandoned by this codebase's own bar for the rest of Batch 1.
tree-sitter-kotlin-ng = "1.1"
# codepack-sanitize's own crate, depended on only by codepack-cli (and, in a later task,
# the desktop shell) — never by codepack-engine (see the decision record for why).
codepack-sanitize = { path = "crates/codepack-sanitize" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The core must stay portable and offline; these catch accidental regressions early.
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
