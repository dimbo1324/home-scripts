# cargo-deny configuration. Wired into `cargo xtask gate` and CI from stage S1 onward,
# now that the workspace has real dependencies.

[advisories]
yanked = "deny"
# Every entry below is a transitive dependency of the S11 Tauri desktop shell, none a
# direct dependency of our own code, and none has a safe upgrade available per the
# advisories themselves. Owner decision 2026-07-25, see docs/__arch__/open-questions.md.
#
# Each carries a `reason`, not a trailing comment, so the justification appears in
# `cargo deny`'s own output rather than only in this file (audit No. 33). The
# `ignored advisories` step of `cargo xtask gate` reports any entry that no longer matches
# anything in the graph, so the list prunes itself instead of outliving its cause.
ignore = [
    # unic-* (open-i18n/rust-unic, archived) -- via urlpattern -> tauri-utils -> tauri
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: archived upstream, reached only through tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: archived upstream, reached only through tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: archived upstream, reached only through tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: archived upstream, reached only through tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: archived upstream, reached only through tauri-utils" },

    # gtk-rs GTK3 bindings (unmaintained; GTK4 bindings exist but Tauri's tray crates
    # have not migrated) -- via tray-icon/muda -> tauri, the Linux tray backend, which
    # this Windows-only build does not even compile.
    { id = "RUSTSEC-2024-0411", reason = "gdkwayland-sys: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0412", reason = "gdk: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0413", reason = "atk: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0414", reason = "gdkx11-sys: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0415", reason = "gtk: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0416", reason = "atk-sys: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0417", reason = "gdkx11: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0418", reason = "gdk-sys: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0419", reason = "gtk3-macros: GTK3 binding, Linux tray backend only" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-sys: GTK3 binding, Linux tray backend only" },

    # pulled in by glib-macros, part of the same GTK3 stack above
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: via glib-macros, same GTK3 stack" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own workspace crates (e.g. codepack-scanner ->
# codepack-core, S2 onward) have no semver range by design — they are pinned to the
# exact local commit already. Without this, cargo-deny flags every in-workspace path
# dependency as a "wildcard", which is a false positive for internal, unpublished
# crates, not a real supply-chain risk.
allow-wildcard-paths = true

[licenses]
# Permissive licenses only. A copyleft dependency needs an explicit owner decision
# recorded in docs/__arch__/open-questions.md.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Our own workspace crates (all `publish = false`, never shipped to crates.io) don't
# carry a `license` field yet — that is a separate, unrelated decision. Don't fail the
# license check on our own unpublished code.
[licenses.private]
ignore = true

# Copyleft dependencies pulled in transitively by the S11 desktop shell (wry's
# CSS engine, and the `notify` watch-mode crate) — none is a direct dependency of
# our own code. Owner decision 2026-07-25, see docs/__arch__/open-questions.md.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cssparser"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cssparser-macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "dtoa-short"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "option-ext"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "selectors"

[[licenses.exceptions]]
allow = ["CC0-1.0"]
name = "notify"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
