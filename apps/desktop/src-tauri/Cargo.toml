[package]
name = "codepack-desktop"
description = "Tauri desktop shell for codepack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# The binary keeps the crate's own name, **not** the product name.
#
# `codepack-cli` already produces a binary called `codepack`, and two targets writing the
# same `target/debug/codepack.exe` is a real collision: cargo warns about it today, says
# it may become a hard error, and in practice makes `cargo test --workspace` fail
# intermittently as the two builds race to replace the same file.
#
# The user-facing name is unaffected: what appears in the applications menu and the task
# manager comes from `productName` in `tauri.conf.json`, which is still `codepack`.
[[bin]]
name = "codepack-desktop"
path = "src/main.rs"

# The command layer is also a library so the tests can call each `#[tauri::command]`
# function directly, without standing up a webview. ROADMAP §3's acceptance criteria
# are about what the commands do, not about how a browser renders them.
[lib]
name = "codepack_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
codepack-core.workspace = true
# Audit No. 6: names a bundle's extraction directory by a hash of the archive path, so a
# validated bundle is unpacked under the app's own data rather than beside somebody's file.
sha2.workspace = true
codepack-engine.workspace = true
codepack-sanitize.workspace = true
codepack-scanner.workspace = true
codepack-security.workspace = true
codepack-storage.workspace = true
codepack-tokens.workspace = true
codepack-archive.workspace = true
# Stage S13's offline handoff. Inherited without default features (declared that way at
# the workspace root), so no HTTP client and no credential store reach this binary —
# `cargo xtask gate` checks exactly that.
codepack-ai.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only: builds a real archive so the bundle-extraction path is exercised against
# an actual ZIP rather than a pre-extracted directory.
zip.workspace = true

[lints]
workspace = true
