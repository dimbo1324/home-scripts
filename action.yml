name: "codepack secret scan"
description: >-
  Scan a repository for committed secrets and risky code, entirely on the runner,
  and optionally upload the findings as SARIF.
author: "codepack"

branding:
  icon: "shield"
  color: "purple"

# Why this file sits at the repository root: GitHub resolves `uses: owner/repo@ref` to
# an `action.yml` at the root of that repository, and nowhere else. It is the one file
# in this project whose location is dictated by somebody else's tool.
#
# What this action is NOT: a network scanner. `codepack scan` reads the checkout on the
# runner and nothing else — invariant I1 holds here exactly as it does on a laptop, and
# the binary this action installs contains no HTTP client at all.

inputs:
  project:
    description: "Directory to scan. Defaults to the checkout root."
    required: false
    default: "."
  fail-on:
    description: >-
      Lowest severity that fails the job: critical (default), high, medium or low.
      The default matches codepack's published exit-code contract.
    required: false
    default: "critical"
  history:
    description: >-
      Scan the git history instead of the working tree — the check that finds a
      credential which was committed and later deleted. Needs a checkout with history
      (`actions/checkout` with `fetch-depth: 0`).
    required: false
    default: "false"
  since:
    description: >-
      With history scanning: only look at what has been added since this ref, typically
      the base branch. Empty means the whole history, up to max-commits.
    required: false
    default: ""
  max-commits:
    description: "With history scanning: how many commits to walk. 0 walks all of them."
    required: false
    default: "500"
  sarif:
    description: >-
      Where to write SARIF 2.1.0. Empty writes none. Upload it with
      github/codeql-action/upload-sarif to get findings as code-scanning alerts.
    required: false
    default: "codepack.sarif"
  ref:
    description: >-
      Git ref of codepack to install: a tag, a branch, or a full commit sha. Defaults to
      a pinned commit so a run is reproducible — `main` moves, and an action that
      installs from a moving branch cannot promise the same result twice.
    required: false
    default: "e782e85"

outputs:
  exit-code:
    description: "0 clean, 3 findings at or above fail-on, 1 error, 2 bad arguments."
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: "The SARIF file that was written, if any."
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    # Built from source rather than downloaded: codepack has no signed release binaries
    # yet (stage S14), and an action that curls an unsigned binary from the internet
    # would be doing the exact thing this tool exists to argue against. GitHub-hosted
    # runners ship a Rust toolchain, so this needs no toolchain action.
    #
    # Every input reaches these scripts through `env:`, never through `${{ }}` inside
    # `run:`. An expression is expanded *before* the shell starts, so its text becomes
    # part of the script — a value containing `$(…)`, a backtick or a quote is then code,
    # not data. In a workflow triggered by `pull_request_target` or `issue_comment` that
    # text can come from a stranger. For an action whose whole purpose is finding
    # secrets, handing the runner's token to one would be a particularly poor irony.
    - name: Install codepack
      shell: bash
      env:
        CODEPACK_REF: ${{ inputs.ref }}
      run: |
        set -e
        if command -v codepack >/dev/null 2>&1; then
          echo "codepack is already on PATH; using it."
          exit 0
        fi

        # A ref is a tag, a branch or a commit; nothing else is accepted, so a value that
        # tried to be an argument or a URL stops here rather than reaching cargo.
        if ! printf '%s' "$CODEPACK_REF" | grep -Eq '^[A-Za-z0-9._/-]{1,128}$'; then
          echo "::error::ref must be a plain git ref; got: $CODEPACK_REF"
          exit 2
        fi

        # A full commit sha is a `--rev`; anything else is a branch or a tag. Cargo
        # rejects the wrong one rather than guessing, so the choice is made here.
        if printf '%s' "$CODEPACK_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          selector=(--rev "$CODEPACK_REF")
        elif printf '%s' "$CODEPACK_REF" | grep -Eq '^v[0-9]'; then
          selector=(--tag "$CODEPACK_REF")
        else
          selector=(--branch "$CODEPACK_REF")
        fi
        cargo install --locked --git https://github.com/dimbo1324/codepack \
          "${selector[@]}" codepack-cli

    - name: Scan
      id: scan
      shell: bash
      env:
        CODEPACK_PROJECT: ${{ inputs.project }}
        CODEPACK_FAIL_ON: ${{ inputs.fail-on }}
        CODEPACK_HISTORY: ${{ inputs.history }}
        CODEPACK_SINCE: ${{ inputs.since }}
        CODEPACK_MAX_COMMITS: ${{ inputs.max-commits }}
        CODEPACK_SARIF: ${{ inputs.sarif }}
      run: |
        # `set -e` is deliberately NOT used: exit code 3 is a *result*, not a crash, and
        # this step has to read it before deciding anything. GitHub runs `bash -eo
        # pipefail` by default, which is why the command is written to swallow its own
        # status explicitly.
        set +e

        # GitHub does not type-check `inputs`, so the two values that steer behaviour are
        # checked against a whitelist here. A typo becomes an error rather than a silently
        # different scan.
        case "$CODEPACK_FAIL_ON" in
          critical|high|medium|low) ;;
          *) echo "::error::fail-on must be critical, high, medium or low; got: $CODEPACK_FAIL_ON"; exit 2 ;;
        esac
        case "$CODEPACK_HISTORY" in
          true|false) ;;
          *) echo "::error::history must be true or false; got: $CODEPACK_HISTORY"; exit 2 ;;
        esac
        if ! printf '%s' "$CODEPACK_MAX_COMMITS" | grep -Eq '^[0-9]+$'; then
          echo "::error::max-commits must be a number; got: $CODEPACK_MAX_COMMITS"
          exit 2
        fi

        args=(scan "$CODEPACK_PROJECT" --fail-on "$CODEPACK_FAIL_ON")

        if [ "$CODEPACK_HISTORY" = "true" ]; then
          args+=(--history --max-commits "$CODEPACK_MAX_COMMITS")
          if [ -n "$CODEPACK_SINCE" ]; then
            args+=(--since "$CODEPACK_SINCE")
          fi
        fi

        if [ -n "$CODEPACK_SARIF" ]; then
          args+=(--sarif "$CODEPACK_SARIF")
          # A heredoc delimiter, because a value containing a newline would otherwise let
          # a caller append step outputs of its own choosing.
          {
            echo "sarif-file<<CODEPACK_EOF"
            printf '%s\n' "$CODEPACK_SARIF"
            echo "CODEPACK_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

        codepack "${args[@]}"
        status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"

        case $status in
          0) echo "::notice::codepack found nothing at or above $CODEPACK_FAIL_ON." ;;
          3) echo "::error::codepack found secrets at or above $CODEPACK_FAIL_ON." ;;
          *) echo "::error::codepack failed with exit code $status." ;;
        esac
        exit $status
